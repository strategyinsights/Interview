[project]
name = "analytics-starter"
version = "0.1.0"
description = "Minimum viable Python repo for ad-hoc CSV/Excel analytics."
requires-python = ">=3.12,<3.13"

dependencies = [
    "pandas>=2.3,<3",
    "polars>=1.9,<2",
    "pyarrow>=17.0,<18",
    "numpy>=2.0,<3",
    "openpyxl>=3.1,<4",
    "matplotlib>=3.9,<4",
]

[dependency-groups]
notebook = [
    "marimo>=0.9",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics"]

[tool.uv]
default-groups = ["notebook", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
